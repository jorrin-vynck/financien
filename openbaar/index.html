<style>
/* indeling: op gsm één kolom in deze volgorde, op een computer twee kolommen */
.cols { display: flex; flex-direction: column; gap: var(--gap); }
.col { display: contents; }
#hero { order: 1; } #accCard { order: 2; } #recvCard { order: 3; } #budgetCard { order: 4; } #spendCard { order: 5; } #catCard { order: 6; } #txCard { order: 7; } #moreCard { order: 8; }
@media (min-width: 900px) {
  .cols { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: start; gap: var(--gap); }
  .col { display: flex; flex-direction: column; gap: var(--gap); }
}
.card h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h2 .sub { font-weight: 500; font-size: 13px; letter-spacing: 0; }
.cardhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.cardhead h2 { margin: 0 !important; }

/* vermogen bovenaan */
#hero { padding: var(--sp2) 0 var(--sp2); }
.hlabel { color: var(--muted); font-size: 14px; font-weight: 500; min-height: 20px; }
.hval { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 2px 0 4px; }
.hdelta { font-size: 15px; font-weight: 600; min-height: 22px; }
.hdelta .sub { font-weight: 500; }
#wchart { margin: var(--sp4) 0 var(--sp3); }
#wrange { display: flex; width: 100%; justify-content: space-between; }
#wrange button { flex: 1; }

.av.c { color: #fff !important; font-size: 15px !important; }
.stale { color: var(--neg) !important; }

/* rekeningen: vakken in de kleur van de bank */
.accs { display: flex; flex-direction: column; gap: var(--sp2); }
.acc { border: 0; border-radius: 14px; padding: var(--sp3) var(--sp4); text-align: left; font: inherit; color: #fff; cursor: pointer; width: 100%;
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 2px var(--sp3); }
.acc .an { font-size: 15px; font-weight: 650; }
.acc .at { font-size: 18px; font-weight: 700; letter-spacing: -.01em; text-align: right; white-space: nowrap; }
.acc .al { grid-column: 1 / -1; font-size: 13.5px; opacity: .9; display: grid; gap: var(--sp1); margin-top: var(--sp2); padding-top: var(--sp2); border-top: 1px solid rgba(255,255,255,.25); }
.acc .al div { display: flex; justify-content: space-between; gap: var(--sp3); } .acc .al span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc.rev { background: #000; color: #fff; }  /* Revolut: zwart met witte tekst */ .acc.ing { background: var(--ing); } .acc.cre { background: var(--crelan); } .acc.bel { background: #2f6fdb; }  /* blauw: complementair aan het oranje van ING */

/* budget */
.bnav { display: flex; align-items: center; gap: 4px; }
.bnav button { width: 34px; height: 34px; border-radius: 99px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; line-height: 1; }
.bnav span { font-size: 14px; font-weight: 600; min-width: 92px; text-align: center; }
.bbig { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.bbar { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); margin: var(--sp3) 0 0; overflow: visible; }
.bbar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.bbar > s { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--text); opacity: .45; border-radius: 2px; }
.pots { margin-top: var(--sp4); }
.pot { padding: var(--sp2) 0; cursor: pointer; }
.pot .ph { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.pot .ph .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pot .ph .vv { white-space: nowrap; font-size: 14px; }
.pot .pbar { position: relative; height: 6px; border-radius: 99px; background: var(--surface-2); margin-top: var(--sp2); }
.pot .pbar > i { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.pot.warn .pbar > i { background: var(--amber); } .pot.over .pbar > i { background: var(--neg); } .pot.good .pbar > i { background: var(--pos); }
.grp { font-size: 13px; font-weight: 600; color: var(--muted); margin: var(--sp4) 0 0; }

/* uitgaven per maand */
.readout { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.readout .big { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }

/* categorieën */
.cat .cb { height: 4px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; position: relative; }
.cat .cb > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }

/* transacties */
.txtools { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.txtools input[type=search] { width: 100%; }
.fchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { flex: none; border: 0; background: var(--surface-2); color: var(--text-2); font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 99px; white-space: nowrap; }
.fchip.on { background: var(--text); color: var(--bg); }
select.fchip { -webkit-appearance: none; appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.dhead { font-size: 13px; font-weight: 600; color: var(--muted); margin: var(--sp4) 0 var(--sp1); }
.addbtn { width: 28px; height: 28px; border-radius: 99px; border: 0; background: var(--surface-2); color: var(--text); font-size: 18px; line-height: 1; margin-left: var(--sp2); vertical-align: middle; }
.li .end.in { color: var(--pos); }
.morebtn { width: 100%; margin-top: 10px; }
.empty { color: var(--muted); font-size: 14px; padding: 14px 0; text-align: center; }

/* onderbladen */
.sbig { font-size: 32px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
.sheet .sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 4px; }
.sheet .desc { color: var(--text-2); font-size: 13.5px; word-break: break-word; }
.sheet .btn { width: 100%; padding: 12px; }
.sheet .opts { max-height: 40vh; overflow: auto; }
</style>
<meta name="theme-color" content="#f2f2f6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>window.PAGE = "dash";</script><style>/* Gedeeld thema voor elke pagina (overzicht, beleggen, projecties, boodschappen, beheer).
   Mobiel eerst: tabbalk onderaan op gsm, bovenaan op computer. Licht en donker volgen het toestel. */
:root {
  color-scheme: light;
  --bg: #f2f2f6; --surface: #ffffff; --surface-2: #f5f5f8; --border: #e5e5ea; --card: #ffffff;
  --text: #0c0c10; --text-2: #4d4d57; --muted: #8a8a94; --grid: #ececf1; --hover: rgba(0,0,0,.04);
  --accent: #5b5bd6; --accent-soft: rgba(91,91,214,.12);
  --pos: #0f9f5a; --neg: #e5484d; --pos-soft: rgba(15,159,90,.12); --neg-soft: rgba(229,72,77,.12);
  --in: #0f9f5a; --out: #e5484d; --ref: #9a9aa4;
  --s1: #5b5bd6; --s2: #f59e0b; --s3: #10b981; --s4: #ec4899; --s1-fill: rgba(91,91,214,.12);
  --p1: #5b5bd6; --p2: #f59e0b; --p3: #10b981; --p4: #ec4899;
  --amber: #f59e0b; --org: #f97316; --cyan: #0ea5e9; --yl: #5b5bd6;
  --revolut: #000000; --revolut-fg: #ffffff; --ing: #ff6200; --crelan: #3fa535;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
  --radius: 20px; --tabbar: 64px;
  /* spatiëring: altijd een van deze stappen */
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px;
  --pad: var(--sp4); --gap: var(--sp4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --surface: #111114; --surface-2: #1a1a1f; --border: #26262d; --card: #111114;
    --text: #f4f4f6; --text-2: #b4b4be; --muted: #7d7d89; --grid: #202027; --hover: rgba(255,255,255,.05);
    --accent: #8b8cff; --accent-soft: rgba(139,140,255,.16);
    --pos: #2fd075; --neg: #ff5c61; --pos-soft: rgba(47,208,117,.14); --neg-soft: rgba(255,92,97,.14);
    --in: #2fd075; --out: #ff5c61; --ref: #8a8a96;
    --s1: #8b8cff; --s2: #fbbf24; --s3: #34d399; --s4: #f472b6; --s1-fill: rgba(139,140,255,.16);
    --p1: #8b8cff; --p2: #fbbf24; --p3: #34d399; --p4: #f472b6;
    --amber: #fbbf24; --org: #fb923c; --cyan: #38bdf8; --yl: #8b8cff;
    --revolut: #000000; --revolut-fg: #ffffff; --ing: #ff6200; --crelan: #3fa535;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg) !important; color: var(--text) !important;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif !important;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1080px !important; margin: 0 auto; padding: var(--sp2) var(--sp4) calc(var(--tabbar) + var(--sp6) + env(safe-area-inset-bottom)) !important; }
@media (min-width: 900px) { :root { --pad: var(--sp5); --gap: var(--sp5); } .wrap { padding-left: var(--sp5) !important; padding-right: var(--sp5) !important; } }
body > .wrap > header, .wrap > header { display: none !important; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 17px !important; font-weight: 650 !important; letter-spacing: -.01em; margin: 0 0 var(--sp3) !important; color: var(--text) !important; text-transform: none !important; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
a { color: var(--accent); text-decoration: none; }
.sub, .note, .label, .src { color: var(--muted) !important; font-size: 13px; }
.pos, .up, .g { color: var(--pos) !important; } .neg, .dn, .r { color: var(--neg) !important; }
.card { background: var(--surface) !important; border: 0 !important; border-radius: var(--radius) !important; box-shadow: var(--shadow) !important; padding: var(--pad) !important; }
.section { margin-top: var(--gap) !important; }
.grid { gap: var(--gap) !important; }
.row2 { margin-top: 12px !important; }
.tile .label { font-size: 13px; } .tile .value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted) !important; font-weight: 500; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 10px 8px; border-bottom: 1px solid var(--grid); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
@media (max-width: 600px) { .hide-s { display: none !important; } }
input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=search] { -webkit-appearance: none; appearance: none; }
button { font: inherit; cursor: pointer; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: var(--text); color: var(--bg); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.btn.soft { background: var(--surface-2); color: var(--text); }
.btn:disabled, button:disabled { opacity: .45; cursor: default; }
.chip, .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--text-2); border: 0; }
/* gesegmenteerde knoppen (perioden, filters) */
.seg, .seg-toggle, .ranges { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; border: 0 !important; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.seg::-webkit-scrollbar, .ranges::-webkit-scrollbar { display: none; }
.seg button, .seg-toggle button, .ranges button { font: inherit; font-size: 13px; font-weight: 600; border: 0 !important; background: transparent !important; color: var(--muted) !important;
  padding: 6px 12px !important; border-radius: 999px !important; white-space: nowrap; min-height: 32px; }
.seg button.on, .seg-toggle button.on, .ranges button.on { background: var(--surface) !important; color: var(--text) !important; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on, :root:not([data-theme="light"]) .ranges button.on, :root:not([data-theme="light"]) .seg-toggle button.on { background: #2a2a31 !important; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg { touch-action: pan-y; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
details summary::-webkit-details-marker { display: none; }
::selection { background: var(--accent-soft); }

/* ---------- bovenbalk + tabbalk ---------- */
.appbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); padding-top: env(safe-area-inset-top); }
.appbar .in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; }
.appbar h1 { font-size: 24px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .acts { display: flex; gap: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: var(--shadow); }
.iconbtn svg { width: 20px; height: 20px; touch-action: manipulation; }
.iconbtn.on { background: var(--text); color: var(--bg); }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 10.5px; font-weight: 600; text-decoration: none; padding: 4px 0; min-height: 48px; justify-content: center; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a.on { color: var(--text); }
@media (min-width: 900px) {
  :root { --tabbar: 0px; }
  .tabs { position: static; background: transparent; border: 0; padding: 0; backdrop-filter: none; -webkit-backdrop-filter: none; justify-content: flex-end; gap: 4px; flex: none; }
  .tabs a { flex: none; flex-direction: row; gap: 6px; font-size: 14px; padding: 8px 12px; border-radius: 999px; min-height: 0; }
  .tabs a svg { width: 18px; height: 18px; }
  .tabs a.on { background: var(--surface); box-shadow: var(--shadow); }
  .appbar h1 { font-size: 22px; }
}

/* ---------- bedragen verbergen ---------- */
html.priv .pm { letter-spacing: .02em; }

/* ---------- melding ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 14px; z-index: 99; font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.err { background: var(--neg); color: #fff; }

/* ---------- onderblad (gsm) / venster (computer) ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 88vh; overflow: auto;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--border); margin: 0 auto 12px; }
.sheet h3 { font-size: 18px; margin: 0 0 4px; }
.sheet .srow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .sheet .srow > * { flex: 1; min-width: 0; }
.sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.sheet .opt { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); cursor: pointer; font-size: 14px; }
.sheet .opt.on { background: var(--text); color: var(--bg); }
.sheet label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text-2); margin-top: 10px; }
.sheet .close { position: absolute; right: 14px; top: 12px; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 460px; border-radius: 22px; transform: translate(-50%, -46%); opacity: 0; transition: transform .2s, opacity .2s; padding-bottom: 22px; }
  .sheet.open { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
}

/* ---------- klein venster naast een element (oude pagina's) ---------- */
.pop { position: fixed; z-index: 80; background: var(--surface); border-radius: 14px; padding: 12px; min-width: 240px; max-width: calc(100vw - 20px); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.pop h4 { margin: 0 0 8px; font-size: 14px; }
.pop .row { display: flex; gap: 6px; margin: 6px 0; align-items: center; flex-wrap: wrap; } .pop .row > * { flex: 1; }
.pop .opts { max-height: 260px; overflow: auto; }
.pop .opt { padding: 7px 10px; cursor: pointer; border-radius: 8px; } .pop .opt:hover, .pop .opt.on { background: var(--surface-2); }
.pop .muted { color: var(--muted); font-size: 12.5px; }

/* ---------- tooltip van oudere grafieken: op een aanraakscherm boven je vinger ---------- */
#tip, .tip { background: var(--text) !important; color: var(--bg) !important; border: 0 !important; border-radius: 10px !important; padding: 7px 10px !important; font-size: 12.5px !important; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#tip .sub, .tip .sub { color: inherit !important; opacity: .7; }
html.touch #tip { transform: translate(-40%, calc(-100% - 46px)); }

/* ---------- gedeelde grafiek met slepen ---------- */
.fchart { position: relative; user-select: none; -webkit-user-select: none; touch-action: pan-y; cursor: crosshair; }
.fchart svg { display: block; width: 100%; overflow: visible; }
.fchart .flabel { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; pointer-events: none; font-weight: 500; }

/* ---------- lijsten in apps-stijl ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2) 0; min-height: 56px; cursor: pointer; border-radius: 12px; }
.li .av { flex: none; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 17px; font-weight: 700; background: var(--surface-2); color: var(--text-2); }
.li .mid { flex: 1; min-width: 0; }
.li .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .end { text-align: right; font-weight: 600; white-space: nowrap; font-size: 15px; }
.li .end .s { font-weight: 500; }
@media (hover: hover) { .li:hover { background: var(--hover); box-shadow: -8px 0 0 var(--hover), 8px 0 0 var(--hover); } }

/* oude terminalkleuren in kleine stukjes tekst */
.a { color: var(--amber); } .c { color: var(--cyan); } .m { color: var(--muted); } .y { color: var(--accent); }
.alert { background: var(--surface) !important; border-radius: var(--radius) !important; border: 0 !important; padding: 14px 16px !important; margin-bottom: 12px !important; box-shadow: inset 3px 0 0 var(--neg); }
#logout { position: static !important; }

[hidden] { display: none !important; }

/* =====================================================================
   ASCII-STIJL (aan via de schakelaar op het inlogscherm of in Beheer)

  /* FIN.line(el, {series:[{vals, color, width, dash, fill}], height, base (gestippelde nullijn), axis (y-labels rechts), fmt, label(i), onScrub(i|null)}) */
  FIN.line = (el, o) => {
    o = { ...o, label: null };  // geen zwevende labels: de waarde staat bovenaan de pagina, zoals in een bank-app
    const S = o.series.filter(s => s.vals && s.vals.length), n = S.length ? S[0].vals.length : 0;
    const W = Math.max(200, el.clientWidth), H = o.height || 200, T = o.label ? 22 : 8, B = o.xlabels ? 22 : 6, R = o.axis ? 46 : 2, L = 2;
    el.classList.add("fchart");
    if (!n) { el.innerHTML = `<div class="sub" style="padding:20px 0">Nog geen gegevens.</div>`; return; }
    const all = S.flatMap(s => s.lo ? [...s.vals, ...s.lo] : s.vals).filter(v => v != null); if (o.base != null) all.push(o.base); if (o.zero) all.push(0);
    let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    let step = null; if (o.axis) { step = niceStep(hi - lo); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; }
    else { const pad = (hi - lo) * .08; lo -= pad; hi += pad; }
    const x = i => L + (W - L - R) * (n === 1 ? .5 : i / (n - 1)), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const P = vals => { let s = "", on = false; vals.forEach((v, i) => { if (v == null) { on = false; return; } s += `${on ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; on = true; }); return s; };
    let g = "";
    if (o.axis) for (let v = lo; v <= hi + step / 2; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${W - R + 6}" y="${y(v) + 4}">${(o.fmt || FIN.eur)(Math.abs(v) < step / 1e6 ? 0 : v)}</text>`;
    if (o.xlabels) { const k = Math.min(n, W < 420 ? 3 : 5); for (let j = 0; j < k; j++) { const i = Math.round(j * (n - 1) / Math.max(1, k - 1));
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${j === 0 ? "start" : j === k - 1 ? "end" : "middle"}">${o.xlabels(i)}</text>`; } }
    if (o.base != null) g += `<line x1="${L}" x2="${W - R}" y1="${y(o.base)}" y2="${y(o.base)}" stroke="var(--muted)" stroke-dasharray="1 4" stroke-linecap="round" opacity=".7"/>`;
    const gid = "g" + Math.random().toString(36).slice(2, 8);
    S.forEach((s, k) => {
      if (s.lo) {  // band tussen twee reeksen (bv. kansmarge)
        g += `<path d="${P(s.vals)}${s.lo.map((v, i) => `L${x(s.lo.length - 1 - i).toFixed(1)},${y(s.lo[s.lo.length - 1 - i]).toFixed(1)}`).join("")}Z" fill="${s.color}" opacity="${s.opacity || .15}"/>`;
        return; }
      if (s.fill) { const first = s.vals.findIndex(v => v != null);
        g += `<defs><linearGradient id="${gid}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
          <path d="${P(s.vals)}L${x(n - 1)},${H - B}L${x(first)},${H - B}Z" fill="url(#${gid}${k})"/>`; }
      g += `<path d="${P(s.vals)}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""}/>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<line class="cx" y1="${T - 4}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
      ${S.map((s, k) => s.dot === false || s.lo ? "" : `<circle class="cd" data-k="${k}" r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`).join("")}</svg>${o.label ? `<div class="flabel" style="opacity:0"></div>` : ""}`;
    const svg = el.querySelector("svg"), cx = svg.querySelector(".cx"), dots = [...svg.querySelectorAll(".cd")], lab = el.querySelector(".flabel");
    scrubber(el, n, x, i => {
      cx.setAttribute("x1", x(i)); cx.setAttribute("x2", x(i)); cx.setAttribute("opacity", .6);
      dots.forEach(d => { const v = S[+d.dataset.k].vals[i]; if (v == null) return d.setAttribute("opacity", 0); d.setAttribute("cx", x(i)); d.setAttribute("cy", y(v)); d.setAttribute("opacity", 1); });

  /* FIN.bars(el, {labels, series:[{vals, color (kleur of functie v,i)}], height, axis, fmt, xlabel(i), selected, onScrub(i|null), onPick(i)}) */
  FIN.bars = (el, o) => {
    const n = o.labels.length, S = o.series, W = Math.max(200, el.clientWidth), H = o.height || 180, T = 8, B = 22, R = o.axis ? 46 : 0, L = 0;
    el.classList.add("fchart");
    if (!n) { el.innerHTML = `<div class="sub" style="padding:20px 0">Nog geen gegevens.</div>`; return; }
    const all = S.flatMap(s => s.vals); let lo = Math.min(0, ...all), hi = Math.max(0, ...all, 1e-9);
    const step = niceStep(hi - lo); lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step; if (hi === lo) hi = lo + step;
    const slot = (W - L - R) / n, x = i => L + slot * (i + .5), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const gap = S.length > 1 ? 2 : 0, bw = Math.max(3, Math.min(26, (slot * .62 - gap * (S.length - 1)) / S.length));
    let g = "";
    if (o.axis) for (let v = lo; v <= hi + step / 2; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${W - R + 6}" y="${y(v) + 4}">${(o.fmt || FIN.eur)(Math.abs(v) < step / 1e6 ? 0 : v)}</text>`;
    if (lo < 0) g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" opacity=".5"/>`;
    for (let i = 0; i < n; i++) {
      const tot = S.length * bw + gap * (S.length - 1); let bars = "";
      S.forEach((s, k) => { const v = s.vals[i]; if (!v) return; const x0 = x(i) - tot / 2 + k * (bw + gap), y0 = y(0), y1 = y(v), h = Math.abs(y0 - y1), r = Math.min(4, h, bw / 2), up = v > 0;
        const c = typeof s.color === "function" ? s.color(v, i) : s.color;

                   : `<path d="M${x0},${y0}V${y1 - r}q0,${r} ${r},${r}H${x0 + bw - r}q${r},0 ${r},-${r}V${y0}Z" fill="${c}"/>`; });
      g += `<g class="bg" data-i="${i}" opacity="${o.selected != null && o.selected !== i ? .4 : 1}">${bars}</g>`;
    }
    const k = n <= 13 ? n : Math.min(n, W < 420 ? 4 : 6), every = n <= 13 ? (W / n < 26 ? 2 : 1) : null;
    if (o.xlabel) for (let j = 0; j < (every ? n : k); j++) { const i = every ? j : Math.round(j * (n - 1) / Math.max(1, k - 1)); if (every && (n - 1 - i) % every) continue;
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" style="${o.selected === i ? "fill:var(--text);font-weight:700" : ""}">${o.xlabel(i)}</text>`; }
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
    const groups = [...el.querySelectorAll(".bg")];
    const dim = i => groups.forEach((gg, j) => gg.setAttribute("opacity", i == null ? (o.selected != null && o.selected !== j ? .4 : 1) : j === i ? 1 : .35));
    scrubber(el, n, x, i => { dim(i); if (o.onScrub) o.onScrub(i); }, () => { dim(null); if (o.onScrub) o.onScrub(null); }, o.onPick);
  };

  // ---------- oudere grafieken (mousemove) laten werken met een vinger ----------
  let tsvg = null;
  addEventListener("pointerdown", e => { if (e.pointerType === "touch") document.documentElement.classList.add("touch"); }, { passive: true, capture: true });
  const fwd = e => {

  const queued = [];

    const pb = document.getElementById("privBtn"); if (pb) pb.onclick = () => FIN.setPriv(!document.documentElement.classList.contains("priv"));
    const lo = document.getElementById("logout"); if (lo) { lo.className = "iconbtn"; lo.removeAttribute("style"); lo.innerHTML = svgI("out"); lo.title = "Afmelden"; el.querySelector(".acts").appendChild(lo); }

    queued.splice(0).forEach(a => FIN.addAction(...a));
    let on = false; try { on = localStorage.getItem("fin_priv") === "1"; } catch (e) {}
    if (pub) { FIN.setPriv(true);  // openbaar: bedragen altijd verborgen, met een knop om te ontgrendelen

  }

  addEventListener("load", () => { const lo = document.getElementById("logout"), acts = document.querySelector(".appbar .acts");
    if (lo && acts && !acts.contains(lo)) { lo.className = "iconbtn"; lo.removeAttribute("style"); lo.innerHTML = svgI("out"); lo.title = "Afmelden"; acts.appendChild(lo); } });
  // online: aangemeld zolang de app of site open is (en je de laatste 30 min iets deed); sluiten = afgemeld

      : `<div class="desc"><b>${eur2(p.spent)}</b> van ${eur2(p.avail)} · ${esc(b.categorieen.join(", "))}${list.some(isYearlyTx) ? "<br>Jaarlijkse kosten tellen als 1/12 per maand." : ""}</div>`,
    FIN.canEdit ? `<div class="sec">Budget aanpassen</div><div class="srow"><input class="bd" type="number" inputmode="decimal" step="1" value="${b.bedrag}">
      <select class="per"><option value="maand" ${b.per !== "week" ? "selected" : ""}>per maand</option><option value="week" ${b.per === "week" ? "selected" : ""}>per week</option></select></div>
      <div class="srow"><button class="btn soft sv">Opslaan</button></div>` : "");
  const sv = s.querySelector(".sv"); if (sv) sv.onclick = async () => { const bedrag = +s.querySelector(".bd").value, per = s.querySelector(".per").value;
    try { await FIN.api("profiel_bedrag", { groep: "budgetten", naam: b.naam, bedrag, per }); b.bedrag = bedrag; b.per = per; b.per_maand = per === "week" ? bedrag * 52 / 12 : bedrag;
      FIN.closeSheet(); FIN.toast("Budget aangepast"); render(); } catch (e) { FIN.toast(e.message, true); } };
}
document.querySelectorAll("#periodToggle button").forEach(b => b.addEventListener("click", () => {
  state.period = b.dataset.p; state.weekOffset = 0;
  document.querySelectorAll("#periodToggle button").forEach(x => x.classList.toggle("on", x === b));
  renderBudgets(); try { localStorage.setItem("budgetPeriod", state.period); } catch (e) {}
}));
document.querySelectorAll("#weekNav button").forEach(b => b.addEventListener("click", () => {
  if (state.period === "week") { state.weekOffset = Math.min(0, state.weekOffset + +b.dataset.w); renderBudgets(); return; }
  const i = months.indexOf(state.month) - +b.dataset.w;  // months staat van nieuw naar oud
  if (i < 0 || i >= months.length) return;
  state.month = months[i]; render();
}));
try { if (localStorage.getItem("budgetPeriod") === "week") { state.period = "week";
  document.querySelectorAll("#periodToggle button").forEach(x => x.classList.toggle("on", x.dataset.p === "week")); } } catch (e) {}

// ---------- transacties ----------
let ROWLIST = [];
const today = iso(new Date()), yest = iso(new Date(Date.now() - 864e5));
const dayHead = d => d === today ? "Vandaag" : d === yest ? "Gisteren" : `${["zo","ma","di","wo","do","vr","za"][new Date(d + "T12:00").getDay()]} ${dLong(d)}`;
const txRow = (t, i) => `<div class="li tx" data-tx="${i}"><div class="av">${catIcon(t.c)}</div><div class="mid"><div class="t tn">${esc(t.n)}</div>
  <div class="s">${esc(t.c)}</div></div>
  <div class="end ${t.a > 0 ? "in" : ""}">${t.a > 0 ? "+" : ""}${eur2(t.a)}</div></div>`;
function txListHtml(list, limit) {
  let h = "", last = null;
  list.slice(0, limit).forEach((t, i) => { if (t.d !== last) { last = t.d; h += `<div class="dhead">${dayHead(t.d)}</div>`; } h += txRow(t, i); });
  return h;
}
function renderRows() {
  const q = $("q").value.trim().toLowerCase();
  const pot = state.pot && (PROFILE.budgetten || []).find(b => b.naam === state.pot);
  const wr = state.period === "week" && pot ? weekRange(state.weekOffset) : null;
  const accs = state.acc;
  const list = txs.filter(t => (state.all || q || (wr ? (t.d >= wr.from && t.d <= wr.to) : t.m === state.month)) && (state.intern || t.c !== "Intern" || pot) && (!state.cat || t.c === state.cat) && (!accs || accs.includes(t.acc))
    && (!pot || inPot(pot, t)) && (!q || (t.n + " " + t.o).toLowerCase().includes(q)));
  const label = pot ? `${pot.icoon || ""} ${pot.naam}` : state.cat ? `${catIcon(state.cat)} ${state.cat}` : accs ? ACC_NAME[accs[0]] || accs[0] : "";
  $("catChip").innerHTML = label ? `<button class="fchip on" id="clearCat">${esc(label)} ✕</button>` : "";
  const cc = $("clearCat"); if (cc) cc.onclick = () => { state.cat = null; state.pot = null; state.acc = null; renderRows(); };
  $("allMonths").classList.toggle("on", state.all); $("allMonths").textContent = state.all || q ? "Alle maanden" : mLabel(state.month);
  $("txCount").textContent = `${list.length}`;
  ROWLIST = list;
  $("rows").innerHTML = txListHtml(list, state.shown) || `<div class="empty">Niets gevonden.</div>`;
  $("moreRows").hidden = list.length <= state.shown;
  $("moreRows").textContent = `Meer tonen (${list.length - state.shown})`;
}
$("rows").addEventListener("click", e => { const r = e.target.closest(".tx"); if (r) txDetail(ROWLIST[+r.dataset.tx]); });
$("moreRows").onclick = () => { state.shown += 60; renderRows(); };
$("allMonths").onclick = () => { state.all = !state.all; state.shown = 40; renderRows(); };
let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(() => { state.shown = 40; renderRows(); }, 120); });

// lijst met transacties in een onderblad (categorie, potje)
function txSheet(title, sub, list, onAll, top = "", bottom = "") {
  list = list.slice().sort((a, b) => b.d.localeCompare(a.d));
  const tot = list.reduce((a, t) => a - t.a, 0);
  const s = FIN.sheet(`<h3>${esc(title)}</h3><div class="sub">${esc(sub)} · ${list.length} transactie${list.length === 1 ? "" : "s"}</div>
    <div class="sbig">${eur2(tot)}</div>${top}<div class="list" style="margin-top:6px">${txListHtml(list, 200) || `<div class="empty">Geen transacties.</div>`}</div>
    ${bottom}<div class="srow"><button class="btn soft all">Toon in transacties</button></div>`);
  s.querySelectorAll(".tx").forEach(r => r.onclick = () => txDetail(list[+r.dataset.tx]));
  s.querySelector(".all").onclick = () => { FIN.closeSheet(); onAll(); };
  return s;
}

// ---------- één transactie: bekijken en aanpassen ----------
const CATS = DATA.categorieen || [...new Set(txs.map(t => t.c))].sort();
function txDetail(t) {
  const ed = FIN.canEdit;
  const s = FIN.sheet(`<div class="sub">${dayHead(t.d)} · ${esc(ACC_NAME[t.acc] || t.acc)}</div><h3 style="margin-top:4px">${esc(t.n)}</h3>
    <div class="sbig ${t.a > 0 ? "pos" : ""}">${t.a > 0 ? "+" : ""}${eur2(t.a)}</div>
    <div class="desc">${esc(t.o)}</div>
    <div class="sec">Categorie</div>
    ${ed ? `<div class="opts">${CATS.map(c => `<div class="opt ${c === t.c ? "on" : ""}" data-c="${esc(c)}">${catIcon(c)} ${esc(c)}</div>`).join("")}</div>
      <label><input type="checkbox" class="always"> Altijd zo voor “${esc(t.n)}”</label>` : `<div>${catIcon(t.c)} ${esc(t.c)}</div>`}
    ${ed ? `<div class="sec">Naam</div><div class="srow"><input class="nm" value="${esc(t.n)}"><button class="btn soft sv" style="flex:none;width:auto">Opslaan</button></div>` : ""}
    ${ed && t.a < 0 ? `<div class="sec">Iemand betaalt je terug</div><div class="srow"><input class="van" placeholder="Wie?"><input class="bd" type="number" inputmode="decimal" step="0.01" value="${(-t.a).toFixed(2)}"></div>
      <div class="srow"><button class="btn soft rv">Op ‘nog te ontvangen’ zetten</button></div>` : ""}
    <div class="srow"><button class="btn soft sim">Alle “${esc(t.n.slice(0, 28))}”</button></div>`);
  s.querySelectorAll(".opt").forEach(o => o.onclick = async () => {
    const c = o.dataset.c, always = s.querySelector(".always").checked;
    try {
      if (always) await FIN.api("regel_add", { categorie: c, trefwoord: t.n });
      if (t.id) await FIN.api("tx_categorie", { id: t.id, categorie: c });
      for (const x of txs) if (x === t || (always && x.n === t.n)) x.c = c;
      FIN.closeSheet(); FIN.toast(always ? `Alle “${t.n}” → ${c}` : `→ ${c}`); render();
    } catch (e) { FIN.toast(e.message, true); }
  });
  const sv = s.querySelector(".sv"); if (sv) sv.onclick = async () => { const naam = s.querySelector(".nm").value.trim();
    try { await FIN.api("tx_naam", { id: t.id, naam }); t.n = naam || t.n; FIN.closeSheet(); FIN.toast("Naam opgeslagen"); renderRows(); } catch (e) { FIN.toast(e.message, true); } };
  const rv = s.querySelector(".rv"); if (rv) rv.onclick = async () => { const van = s.querySelector(".van").value.trim(), bedrag = +s.querySelector(".bd").value;
    if (!van || !bedrag) return FIN.toast("Vul in wie en hoeveel", true);
    try { await FIN.api("tegoed_add", { omschrijving: t.n, bedrag, van }); const r = DATA.tegoeden;
      r.open.push({ id: "nieuw", omschrijving: t.n, bedrag, van, soort: "nieuw" }); r.totaal_open += bedrag; renderReceivables(); FIN.closeSheet(); FIN.toast("Op ‘nog te ontvangen’ gezet"); } catch (e) { FIN.toast(e.message, true); } };
  s.querySelector(".sim").onclick = () => { FIN.closeSheet(); $("q").value = t.n; state.all = true; state.cat = null; state.pot = null; state.acc = null; renderRows(); $("txCard").scrollIntoView({ behavior: "smooth" }); };
}

// ---------- alles tekenen ----------
function render() { state.shown = 40; renderIncome(); renderMonthly(); renderCats(); renderRows(); }
renderHero(); renderBanks(); renderRefresh(); loadStatus(); renderReceivables(); render();
try { const m = sessionStorage.getItem("refreshMsg"); if (m) { window.REFRESH_MSG = m; sessionStorage.removeItem("refreshMsg"); renderRefresh(); FIN.toast(m); } } catch (e) {}
// doorgestuurd vanaf de online versie: meteen vernieuwen
if (onServer() && new URLSearchParams(location.search).has("vernieuw")) {
  history.replaceState(null, "", location.pathname);
  document.addEventListener("fin:ready", doRefresh, { once: true });
}
let rw = innerWidth, rt; addEventListener("resize", () => { if (innerWidth === rw) return; rw = innerWidth; clearTimeout(rt); rt = setTimeout(() => { renderHero(); renderMonthly(); }, 150); });
</script>
</body>
</html>
