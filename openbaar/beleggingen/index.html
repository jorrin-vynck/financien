.av.tk { font-size: 11px !important; font-weight: 800 !important; letter-spacing: -.02em; background: var(--accent-soft) !important; color: var(--accent) !important; }
.av.tk.cr { background: color-mix(in srgb, var(--s4) 16%, transparent) !important; color: var(--s4) !important; }

<meta name="theme-color" content="#f2f2f6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>window.PAGE = "bel";</script><style>/* Gedeeld thema voor elke pagina (overzicht, beleggen, projecties, boodschappen, beheer).
   Mobiel eerst: tabbalk onderaan op gsm, bovenaan op computer. Licht en donker volgen het toestel. */
:root {
  color-scheme: light;
  --bg: #f2f2f6; --surface: #ffffff; --surface-2: #f5f5f8; --border: #e5e5ea; --card: #ffffff;
  --text: #0c0c10; --text-2: #4d4d57; --muted: #8a8a94; --grid: #ececf1; --hover: rgba(0,0,0,.04);
  --accent: #5b5bd6; --accent-soft: rgba(91,91,214,.12);
  --pos: #0f9f5a; --neg: #e5484d; --pos-soft: rgba(15,159,90,.12); --neg-soft: rgba(229,72,77,.12);
  --in: #0f9f5a; --out: #e5484d; --ref: #9a9aa4;
  --s1: #5b5bd6; --s2: #f59e0b; --s3: #10b981; --s4: #ec4899; --s1-fill: rgba(91,91,214,.12);
  --p1: #5b5bd6; --p2: #f59e0b; --p3: #10b981; --p4: #ec4899;
  --amber: #f59e0b; --org: #f97316; --cyan: #0ea5e9; --yl: #5b5bd6;
  --revolut: #000000; --revolut-fg: #ffffff; --ing: #ff6200; --crelan: #3fa535;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
  --radius: 20px; --tabbar: 64px;
  /* spatiëring: altijd een van deze stappen */
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px; --sp6: 32px;
  --pad: var(--sp4); --gap: var(--sp4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #000000; --surface: #111114; --surface-2: #1a1a1f; --border: #26262d; --card: #111114;
    --text: #f4f4f6; --text-2: #b4b4be; --muted: #7d7d89; --grid: #202027; --hover: rgba(255,255,255,.05);
    --accent: #8b8cff; --accent-soft: rgba(139,140,255,.16);
    --pos: #2fd075; --neg: #ff5c61; --pos-soft: rgba(47,208,117,.14); --neg-soft: rgba(255,92,97,.14);
    --in: #2fd075; --out: #ff5c61; --ref: #8a8a96;
    --s1: #8b8cff; --s2: #fbbf24; --s3: #34d399; --s4: #f472b6; --s1-fill: rgba(139,140,255,.16);
    --p1: #8b8cff; --p2: #fbbf24; --p3: #34d399; --p4: #f472b6;
    --amber: #fbbf24; --org: #fb923c; --cyan: #38bdf8; --yl: #8b8cff;
    --revolut: #000000; --revolut-fg: #ffffff; --ing: #ff6200; --crelan: #3fa535;
    --shadow: none;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg) !important; color: var(--text) !important;
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif !important;
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
.wrap { max-width: 1080px !important; margin: 0 auto; padding: var(--sp2) var(--sp4) calc(var(--tabbar) + var(--sp6) + env(safe-area-inset-bottom)) !important; }
@media (min-width: 900px) { :root { --pad: var(--sp5); --gap: var(--sp5); } .wrap { padding-left: var(--sp5) !important; padding-right: var(--sp5) !important; } }
body > .wrap > header, .wrap > header { display: none !important; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
h2 { font-size: 17px !important; font-weight: 650 !important; letter-spacing: -.01em; margin: 0 0 var(--sp3) !important; color: var(--text) !important; text-transform: none !important; }
h3 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
a { color: var(--accent); text-decoration: none; }
.sub, .note, .label, .src { color: var(--muted) !important; font-size: 13px; }
.pos, .up, .g { color: var(--pos) !important; } .neg, .dn, .r { color: var(--neg) !important; }
.card { background: var(--surface) !important; border: 0 !important; border-radius: var(--radius) !important; box-shadow: var(--shadow) !important; padding: var(--pad) !important; }
.section { margin-top: var(--gap) !important; }
.grid { gap: var(--gap) !important; }
.row2 { margin-top: 12px !important; }
.tile .label { font-size: 13px; } .tile .value { font-size: 22px; font-weight: 650; letter-spacing: -.01em; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { text-align: left; color: var(--muted) !important; font-weight: 500; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 10px 8px; border-bottom: 1px solid var(--grid); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; white-space: nowrap; }
@media (max-width: 600px) { .hide-s { display: none !important; } }
input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 12px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=search] { -webkit-appearance: none; appearance: none; }
button { font: inherit; cursor: pointer; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; background: var(--text); color: var(--bg); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
.btn.soft { background: var(--surface-2); color: var(--text); }
.btn:disabled, button:disabled { opacity: .45; cursor: default; }
.chip, .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; border-radius: 999px; padding: 3px 10px; background: var(--surface-2); color: var(--text-2); border: 0; }
/* gesegmenteerde knoppen (perioden, filters) */
.seg, .seg-toggle, .ranges { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 999px; border: 0 !important; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.seg::-webkit-scrollbar, .ranges::-webkit-scrollbar { display: none; }
.seg button, .seg-toggle button, .ranges button { font: inherit; font-size: 13px; font-weight: 600; border: 0 !important; background: transparent !important; color: var(--muted) !important;
  padding: 6px 12px !important; border-radius: 999px !important; white-space: nowrap; min-height: 32px; }
.seg button.on, .seg-toggle button.on, .ranges button.on { background: var(--surface) !important; color: var(--text) !important; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on, :root:not([data-theme="light"]) .ranges button.on, :root:not([data-theme="light"]) .seg-toggle button.on { background: #2a2a31 !important; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
svg { touch-action: pan-y; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; list-style: none; }
details summary::-webkit-details-marker { display: none; }
::selection { background: var(--accent-soft); }

/* ---------- bovenbalk + tabbalk ---------- */
.appbar { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); padding-top: env(safe-area-inset-top); }
.appbar .in { max-width: 1080px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 56px; }
.appbar h1 { font-size: 24px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .acts { display: flex; gap: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: var(--shadow); }
.iconbtn svg { width: 20px; height: 20px; touch-action: manipulation; }
.iconbtn.on { background: var(--text); color: var(--bg); }
.iconbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
  border-top: 1px solid var(--border); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 10.5px; font-weight: 600; text-decoration: none; padding: 4px 0; min-height: 48px; justify-content: center; }
.tabs a svg { width: 24px; height: 24px; }
.tabs a.on { color: var(--text); }
@media (min-width: 900px) {
  :root { --tabbar: 0px; }
  .tabs { position: static; background: transparent; border: 0; padding: 0; backdrop-filter: none; -webkit-backdrop-filter: none; justify-content: flex-end; gap: 4px; flex: none; }
  .tabs a { flex: none; flex-direction: row; gap: 6px; font-size: 14px; padding: 8px 12px; border-radius: 999px; min-height: 0; }
  .tabs a svg { width: 18px; height: 18px; }
  .tabs a.on { background: var(--surface); box-shadow: var(--shadow); }
  .appbar h1 { font-size: 22px; }
}

/* ---------- bedragen verbergen ---------- */
html.priv .pm { letter-spacing: .02em; }

/* ---------- melding ---------- */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 14px; z-index: 99; font-size: 14px; font-weight: 500; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.toast.err { background: var(--neg); color: #fff; }

/* ---------- onderblad (gsm) / venster (computer) ---------- */
.sheet-bg { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; }
.sheet-bg.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 91; background: var(--surface); border-radius: 22px 22px 0 0; max-height: 88vh; overflow: auto;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); overscroll-behavior: contain; }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--border); margin: 0 auto 12px; }
.sheet h3 { font-size: 18px; margin: 0 0 4px; }
.sheet .srow { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .sheet .srow > * { flex: 1; min-width: 0; }
.sheet .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.sheet .opt { padding: 10px 12px; border-radius: 12px; background: var(--surface-2); cursor: pointer; font-size: 14px; }
.sheet .opt.on { background: var(--text); color: var(--bg); }
.sheet label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text-2); margin-top: 10px; }
.sheet .close { position: absolute; right: 14px; top: 12px; }
@media (min-width: 700px) {
  .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 460px; border-radius: 22px; transform: translate(-50%, -46%); opacity: 0; transition: transform .2s, opacity .2s; padding-bottom: 22px; }
  .sheet.open { transform: translate(-50%, -50%); opacity: 1; }
  .sheet .grab { display: none; }
}

/* ---------- klein venster naast een element (oude pagina's) ---------- */
.pop { position: fixed; z-index: 80; background: var(--surface); border-radius: 14px; padding: 12px; min-width: 240px; max-width: calc(100vw - 20px); box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.pop h4 { margin: 0 0 8px; font-size: 14px; }
.pop .row { display: flex; gap: 6px; margin: 6px 0; align-items: center; flex-wrap: wrap; } .pop .row > * { flex: 1; }
.pop .opts { max-height: 260px; overflow: auto; }
.pop .opt { padding: 7px 10px; cursor: pointer; border-radius: 8px; } .pop .opt:hover, .pop .opt.on { background: var(--surface-2); }
.pop .muted { color: var(--muted); font-size: 12.5px; }

/* ---------- tooltip van oudere grafieken: op een aanraakscherm boven je vinger ---------- */
#tip, .tip { background: var(--text) !important; color: var(--bg) !important; border: 0 !important; border-radius: 10px !important; padding: 7px 10px !important; font-size: 12.5px !important; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
#tip .sub, .tip .sub { color: inherit !important; opacity: .7; }
html.touch #tip { transform: translate(-40%, calc(-100% - 46px)); }

/* ---------- gedeelde grafiek met slepen ---------- */
.fchart { position: relative; user-select: none; -webkit-user-select: none; touch-action: pan-y; cursor: crosshair; }
.fchart svg { display: block; width: 100%; overflow: visible; }
.fchart .flabel { position: absolute; top: 0; transform: translateX(-50%); font-size: 12px; color: var(--muted); white-space: nowrap; pointer-events: none; font-weight: 500; }

/* ---------- lijsten in apps-stijl ---------- */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: var(--sp3); padding: var(--sp2) 0; min-height: 56px; cursor: pointer; border-radius: 12px; }
.li .av { flex: none; width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; font-size: 17px; font-weight: 700; background: var(--surface-2); color: var(--text-2); }
.li .mid { flex: 1; min-width: 0; }
.li .t { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .s { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .end { text-align: right; font-weight: 600; white-space: nowrap; font-size: 15px; }
.li .end .s { font-weight: 500; }
@media (hover: hover) { .li:hover { background: var(--hover); box-shadow: -8px 0 0 var(--hover), 8px 0 0 var(--hover); } }

/* oude terminalkleuren in kleine stukjes tekst */
.a { color: var(--amber); } .c { color: var(--cyan); } .m { color: var(--muted); } .y { color: var(--accent); }
.alert { background: var(--surface) !important; border-radius: var(--radius) !important; border: 0 !important; padding: 14px 16px !important; margin-bottom: 12px !important; box-shadow: inset 3px 0 0 var(--neg); }
#logout { position: static !important; }

[hidden] { display: none !important; }

/* =====================================================================
   ASCII-STIJL (aan via de schakelaar op het inlogscherm of in Beheer)
   Tekstbord-look: geen vakken of kaders, knoppen zijn [links], secties gescheiden door lijnen.
   Zelfde indeling, spatiëring en grafieken.
   ===================================================================== */
html.ascii {
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pix: "Silkscreen", "IBM Plex Mono", ui-monospace, monospace;  /* vierkante pixelcijfers */
  --frame: color-mix(in srgb, var(--text) 28%, transparent);
  --link: var(--accent);
}
html.ascii body { font-family: var(--mono) !important; font-size: 14px !important; letter-spacing: -.01em; }
html.ascii *, html.ascii *::before, html.ascii *::after { border-radius: 0 !important; }
html.ascii ::selection { background: var(--accent); color: var(--bg); }
html.ascii input, html.ascii select, html.ascii textarea, html.ascii button { font-family: var(--mono) !important; }

/* geen vakken: kaarten zonder achtergrond, gescheiden door een stippellijn */
html.ascii .card { background: transparent !important; box-shadow: none !important; border-top: 1px dashed var(--frame) !important; }
html.ascii :is(.tile3, .stats > div, .mstats > div, .facts > div, .nut) { background: transparent !important; box-shadow: none !important; }
html.ascii .li .av { background: transparent; }

/* titels als citaatlinks */
html.ascii h2 { text-transform: uppercase !important; letter-spacing: .04em; font-size: 15px !important; }

      if (s.lo) {  // band tussen twee reeksen (bv. kansmarge)
        g += `<path d="${P(s.vals)}${s.lo.map((v, i) => `L${x(s.lo.length - 1 - i).toFixed(1)},${y(s.lo[s.lo.length - 1 - i]).toFixed(1)}`).join("")}Z" fill="${s.color}" opacity="${s.opacity || .15}"/>`;
        return; }

          <path d="${P(s.vals)}L${x(n - 1)},${H - B}L${x(first)},${H - B}Z" fill="url(#${gid}${k})"/>`; }

    }, () => { cx.setAttribute("opacity", 0); dots.forEach(d => d.setAttribute("opacity", 0)); if (lab) lab.style.opacity = 0; if (o.onScrub) o.onScrub(null); });

  /* FIN.bars(el, {labels, series:[{vals, color (kleur of functie v,i)}], height, axis, fmt, xlabel(i), selected, onScrub(i|null), onPick(i)}) */
  FIN.bars = (el, o) => {
    const n = o.labels.length, S = o.series, W = Math.max(200, el.clientWidth), H = o.height || 180, T = 8, B = 22, R = o.axis ? 46 : 0, L = 0;
    el.classList.add("fchart");
    if (!n) { el.innerHTML = `<div class="sub" style="padding:20px 0">Nog geen gegevens.</div>`; return; }
    const all = S.flatMap(s => s.vals); let lo = Math.min(0, ...all), hi = Math.max(0, ...all, 1e-9);
    const step = niceStep(hi - lo); lo = Math.floor(lo / step + 1e-9) * step; hi = Math.ceil(hi / step - 1e-9) * step; if (hi === lo) hi = lo + step;
    const slot = (W - L - R) / n, x = i => L + slot * (i + .5), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
    const gap = S.length > 1 ? 2 : 0, bw = Math.max(3, Math.min(26, (slot * .62 - gap * (S.length - 1)) / S.length));
    let g = "";
    if (o.axis) for (let v = lo; v <= hi + step / 2; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${W - R + 6}" y="${y(v) + 4}">${(o.fmt || FIN.eur)(Math.abs(v) < step / 1e6 ? 0 : v)}</text>`;
    if (lo < 0) g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" opacity=".5"/>`;
    for (let i = 0; i < n; i++) {
      const tot = S.length * bw + gap * (S.length - 1); let bars = "";
      S.forEach((s, k) => { const v = s.vals[i]; if (!v) return; const x0 = x(i) - tot / 2 + k * (bw + gap), y0 = y(0), y1 = y(v), h = Math.abs(y0 - y1), r = Math.min(4, h, bw / 2), up = v > 0;
        const c = typeof s.color === "function" ? s.color(v, i) : s.color;
        bars += up ? `<path d="M${x0},${y0}V${y1 + r}q0,-${r} ${r},-${r}H${x0 + bw - r}q${r},0 ${r},${r}V${y0}Z" fill="${c}"/>`
                   : `<path d="M${x0},${y0}V${y1 - r}q0,${r} ${r},${r}H${x0 + bw - r}q${r},0 ${r},-${r}V${y0}Z" fill="${c}"/>`; });
      g += `<g class="bg" data-i="${i}" opacity="${o.selected != null && o.selected !== i ? .4 : 1}">${bars}</g>`;
    }
    const k = n <= 13 ? n : Math.min(n, W < 420 ? 4 : 6), every = n <= 13 ? (W / n < 26 ? 2 : 1) : null;
    if (o.xlabel) for (let j = 0; j < (every ? n : k); j++) { const i = every ? j : Math.round(j * (n - 1) / Math.max(1, k - 1)); if (every && (n - 1 - i) % every) continue;
      g += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" style="${o.selected === i ? "fill:var(--text);font-weight:700" : ""}">${o.xlabel(i)}</text>`; }
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}</svg>`;
    const groups = [...el.querySelectorAll(".bg")];
    const dim = i => groups.forEach((gg, j) => gg.setAttribute("opacity", i == null ? (o.selected != null && o.selected !== j ? .4 : 1) : j === i ? 1 : .35));
    scrubber(el, n, x, i => { dim(i); if (o.onScrub) o.onScrub(i); }, () => { dim(null); if (o.onScrub) o.onScrub(null); }, o.onPick);
  };

  let tsvg = null;
  addEventListener("pointerdown", e => { if (e.pointerType === "touch") document.documentElement.classList.add("touch"); }, { passive: true, capture: true });

    if (!tsvg) return;

  };
  addEventListener("pointerdown", fwd, { passive: true }); addEventListener("pointermove", fwd, { passive: true });

      $("hlabel").textContent = `${label} op ${dLong(ds[i])}` + (inv ? ` · ingelegd ${eur(inv[i])}` : ""); head(i, "koerswinst sinds " + dLong(ds[0])); } });
}
$("ranges").innerHTML = RANGES.map(([k]) => `<button data-r="${k}" class="${k === range ? "on" : ""}">${k}</button>`).join("");
$("ranges").onclick = e => { const b = e.target.closest("button"); if (!b) return; range = b.dataset.r; try { localStorage.setItem("belRange", range); } catch (er) {}
  $("ranges").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawChart(); };
$("plats").innerHTML = ["Alles", ...Object.keys(PL)].map(k => `<button data-p="${k}" class="${k === plat ? "on" : ""}">${k}</button>`).join("");
$("plats").onclick = e => { const b = e.target.closest("button"); if (!b) return; plat = b.dataset.p;
  $("plats").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawChart(); };

// ---------- kerncijfers: volgen platform en periode ----------
const inPlat = r => plat === "Alles" || (plat === "Crypto" ? r.soort === "crypto" : r.platform === plat && r.soort !== "crypto");
function flowsFor(ds, val, inv, upto) {  // stortingen negatief, waarde op het einde positief
  const fl = []; if (val[0] > 0) fl.push([ds[0], -val[0]]);
  if (inv) for (let i = 1; i <= upto; i++) { const d = inv[i] - inv[i - 1]; if (Math.abs(d) > .005) fl.push([ds[i], -d]); }
  fl.push([ds[upto], val[upto]]); return fl;
}
function drawStats(ds, val, inv, n, g) {
  const dep = inv ? inv[n] - inv[0] : 0, base = val[0] + Math.max(0, dep);
  const td = sum(ALL.filter(inPlat), r => r.dag), long = range === "1J" || range === "Alles";
  const yrs = (new Date(ds[n]) - new Date(ds[0])) / 3.156e10, x = yrs >= .9 ? xirr(flowsFor(ds, val, inv, n)) : null;
  const ret = long && x != null ? ["Per jaar", pct(x), sign(x)] : ["Rendement", base ? pct(g / base) : "—", sign(g)];
  $("kpis").innerHTML = [
    ["Ingelegd", inv ? eur(inv[n]) : "—", "", ""],
    [`Winst ${range === "Alles" ? "" : range}`, (g >= 0 ? "+" : "−") + eur(Math.abs(g)), base ? pct(g / base) : "", sign(g)],
    ["Vandaag", (td >= 0 ? "+" : "−") + eur2(Math.abs(td)), pct(td / Math.max(1, val[n] - td)), sign(td)],
    [ret[0], ret[1], "", ret[2]],
  ].map(([l, v, pc, c]) => `<div><div class="l">${l}</div><div class="v ${c}">${v}${pc ? ` <span class="pc">${pc}</span>` : ""}</div></div>`).join("");
  drawXirr();
}
// ---------- XIRR door de tijd (geselecteerd platform) ----------
function trend(v) {  // rechte trendlijn (kleinste kwadraten) door de gekende punten
  const pts = v.map((y, x) => [x, y]).filter(p => p[1] != null), n = pts.length; if (n < 2) return v.map(() => null);
  const mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
  const b = pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / (pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0) || 1);
  return v.map((_, x) => my + b * (x - mx));
}
function drawXirr() {
  const [vAll, iAll] = seriesFor(plat); let f = vAll.findIndex(v => v > 0); if (f < 0) f = 0;
  const ds = H.datum.slice(f), val = vAll.slice(f), inv = iAll ? iAll.slice(f) : null;
  const ends = {}; ds.forEach((d, i) => ends[d.slice(0, 7)] = i);
  const ms = Object.keys(ends).sort(), pts = ms.map(m => { const i = ends[m]; return (new Date(ds[i]) - new Date(ds[0])) / 3.156e10 < 1 ? null : xirr(flowsFor(ds, val, inv, i)); });
  const k0 = pts.findIndex(v => v != null), card = $("xirrCard");
  if (k0 < 0) { card.hidden = true; return; } card.hidden = false;
  const M = ms.slice(k0), V = pts.slice(k0), last = V.length - 1;
  const rd = i => { $("xirrBig").innerHTML = V[i] == null ? "—" : `<span class="${sign(V[i])}">${pct(V[i])}</span>`; $("xirrSub").textContent = `per jaar · ${MONTHS[+M[i].slice(5, 7) - 1]} ${M[i].slice(0, 4)}`; };
  rd(last);
  // trend: stijgend of dalend, en hoeveel procentpunt per jaar; plus het gemiddelde
  const tr = trend(V), known = V.filter(v => v != null), avg = known.reduce((a, b) => a + b, 0) / known.length;
  const perYear = (tr[last] - tr[0]) / Math.max(1, last) * 12, flat = Math.abs(perYear) < .005;
  const pp = v => (v * 100).toLocaleString("nl-BE", { maximumFractionDigits: 1 });
  $("xirrTrend").innerHTML = (flat ? `<span>→ trend vlak</span>` : `<span class="${perYear > 0 ? "pos" : "neg"}">${perYear > 0 ? "↗ trend stijgt" : "↘ trend daalt"} ${pp(Math.abs(perYear))} procentpunt per jaar</span>`)
    + ` · gemiddeld <b>${pct(avg)}</b>`;
  FIN.line($("xirrChart"), { height: 150, axis: true, zero: true, fmt: v => Math.round(v * 100) + "%", xlabels: i => `${MONTHS[+M[i].slice(5, 7) - 1]} ${M[i].slice(2, 4)}`,
    series: [{ vals: trend(V), color: "var(--muted)", width: 1.5, dash: "5 5", dot: false }, { vals: V, color: "var(--accent)", width: 2.2 }], onScrub: i => rd(i == null ? last : i) });
}

// ---------- posities ----------
const qty = r => r.aantal.toLocaleString("nl-BE", { maximumFractionDigits: r.soort === "crypto" ? 8 : 4 });
const price = v => v < 0.01 ? "€" + v.toPrecision(3).replace(".", ",") : eur2(v);
function spark(tk) {
  const ser = ((KV[tk] || {}).reeks || []).slice(-90); if (ser.length < 2) return "";
  const W = 64, Hh = 28, lo = Math.min(...ser), hi = Math.max(...ser), up = ser.at(-1) >= ser[0];
  const pts = ser.map((v, i) => `${(i / (ser.length - 1) * W).toFixed(1)},${(Hh - 2 - (v - lo) / (hi - lo || 1) * (Hh - 4)).toFixed(1)}`).join(" ");
  return `<svg class="spk" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}"><polyline points="${pts}" fill="none" stroke="var(--${up ? "pos" : "neg"})" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
const posRow = (r, i) => { const d1 = ((KV[r.ticker] || {}).verandering || {})["1D"];
  return `<div class="li" data-i="${i}"><div class="mid"><div class="t">${esc(r.soort === "crypto" ? ({ BTC: "Bitcoin", ETH: "Ethereum", PEPE: "Pepe" }[r.ticker] || r.naam || r.ticker) : r.thema)}</div><div class="s">${esc(r.ticker)} · ${esc(r.platform)}</div></div>${spark(r.ticker)}
    <div class="end">${eur2(r.waarde)}<div>${r.pl != null && r.aankoop ? `<span class="pill ${sign(r.pl)}">${pct(r.pl / r.aankoop)}</span>` : `<span class="s">${Math.round(r.waarde / totVal * 100)}%</span>`}</div></div></div>`; };
const ROWS = [...ETF, ...CRYPTO];
const grp = (l, v, pl, cost) => `<div class="grp"><span>${l}</span><span>${eur(v)}${pl != null && cost ? ` · <span class="${sign(pl)}">${pl >= 0 ? "+" : "−"}${eur(Math.abs(pl))}</span>` : ""}</span></div>`;
$("positions").innerHTML = grp("ETF's", etfVal, sum(ETF, r => r.pl), etfCost) + ETF.map((r, i) => posRow(r, i)).join("") +
  (INV.cash_eur ? `<div class="li"><div class="mid"><div class="t">Cash</div><div class="s">Revolut</div></div><div class="end">${eur2(INV.cash_eur)}</div></div>` : "") +
  (CRYPTO.length ? grp("Crypto", cryptoVal, cryptoCost ? cryptoVal - cryptoCost : (PI.Crypto ? cryptoVal - PI.Crypto.at(-1) : null), cryptoCost || (PI.Crypto ? PI.Crypto.at(-1) : 0)) + CRYPTO.map((r, i) => posRow(r, ETF.length + i)).join("") : "");
$("positions").querySelectorAll(".li[data-i]").forEach(el => el.onclick = () => posSheet(ROWS[+el.dataset.i]));
function posSheet(r) {
  const k = KV[r.ticker] || {}, ch = k.verandering || {}, buys = (D.aankopen || {})[r.ticker] || [];
  const facts = [["Aantal", qty(r)], ["Koers", price(r.koers)], ["Gem. aankoopprijs", r.gem ? price(r.gem) : "—"], ["Ingelegd", r.aankoop ? eur2(r.aankoop) : "—"],
    ["1 jaar hoog", k.hoog_1j ? price(k.hoog_1j) : "—"], ["1 jaar laag", k.laag_1j ? price(k.laag_1j) : "—"],
    ...["1M", "3M", "YTD", "1J"].map(p => [p === "YTD" ? "Dit jaar" : p, ch[p] != null ? `<span class="${sign(ch[p])}">${pct(ch[p])}</span>` : "—"])];
  const s = FIN.sheet(`<div class="sub">${esc(r.ticker)} · ${esc(r.platform)}</div><h3 style="margin-top:4px">${esc(r.naam)}</h3>
    <div class="sbig">${eur2(r.waarde)}</div>
    <div class="hdelta" style="margin-bottom:8px">${r.pl != null ? `<span class="${sign(r.pl)}">${r.pl >= 0 ? "▲" : "▼"} ${eur2(Math.abs(r.pl))} (${pct(r.pl / r.aankoop).replace(/^[+−]/, "")})</span> <span class="sub">totaal</span>` : `<span class="sub">aankoopprijs niet gekend</span>`}</div>
    ${k.reeks && k.reeks.length > 1 ? `<div class="sec" id="sparkV">Koers afgelopen jaar</div><div id="spark"></div>` : ""}
    <div class="facts">${facts.map(([l, v]) => `<div>${l}<b>${v}</b></div>`).join("")}</div>
    ${buys.length ? `<div class="sec">Aankopen</div><div class="list">${buys.slice().reverse().map(b => `<div class="li" style="cursor:default"><div class="mid"><div class="t">${dLong(b.datum)}</div>
      <div class="s">${b.bedrag < 0 ? "verkoop · " : ""}${b.aantal.toLocaleString("nl-BE", { maximumFractionDigits: 4 })} st. × ${price(Math.abs(b.bedrag) / b.aantal)}${b.opmerking ? " · geschat" : ""}</div></div>
      <div class="end">${eur2(Math.abs(b.bedrag))}</div></div>`).join("")}</div>` : ""}`);
  const sp = s.querySelector("#spark");
  if (sp) { const ser = k.reeks, up = ser.at(-1) >= ser[0];
    const sv = s.querySelector("#sparkV"), base = `Koers afgelopen jaar <span class="${sign(ser.at(-1) - ser[0])}">${pct(ser.at(-1) / ser[0] - 1)}</span>`; sv.innerHTML = base;
    requestAnimationFrame(() => FIN.line(sp, { height: 180, base: ser[0], series: [{ vals: ser, color: up ? "var(--pos)" : "var(--neg)", fill: true, width: 2.2 }],
      onScrub: i => { sv.innerHTML = i == null ? base : `Koers ${price(ser[i])} <span class="${sign(ser[i] - ser[0])}">${pct(ser[i] / ser[0] - 1)}</span> · ${ser.length - 1 - i} handelsdagen geleden`; } })); }
}

// ---------- nieuwe aankoop ----------
const openBuy = () => {
  const opts = ALL.map((r, i) => `<option value="${i}">${esc(r.soort === "crypto" ? r.ticker : (r.thema + " · " + r.ticker))} (${esc(r.platform)})</option>`).join("");
  const s = FIN.sheet(`<h3>Nieuwe aankoop</h3>
    <div class="sec">Wat</div><div class="srow"><select class="pk">${opts}<option value="new">Andere ETF bij Revolut…</option></select></div>
    <div class="srow nt" hidden><input class="tk" placeholder="Ticker, bv. EUNL" autocapitalize="characters"></div>
    <div class="sec">Hoeveel</div><div class="srow"><input class="bd" type="number" inputmode="decimal" step="0.01" placeholder="Bedrag €"><input class="an" type="number" inputmode="decimal" step="any" placeholder="Aantal"></div>
    <div class="srow"><button class="btn sv">Opslaan</button></div>`);
  const pk = s.querySelector(".pk"), bd = s.querySelector(".bd");
  const upd = () => { const r = ALL[+pk.value]; s.querySelector(".nt").hidden = pk.value !== "new"; bd.hidden = !!r && r.platform !== "Revolut"; };
  pk.onchange = upd; upd();
  s.querySelector(".sv").onclick = async () => {
    const r = ALL[+pk.value], aantal = +s.querySelector(".an").value, bedrag = +bd.value;
    if (!aantal) return FIN.toast("Vul het aantal in", true);
    try {
      if (!r || r.platform === "Revolut") { const ticker = r ? r.ticker : s.querySelector(".tk").value.trim().toUpperCase();
        if (!ticker || !bedrag) return FIN.toast("Vul ticker en bedrag in", true);
        await FIN.api("koop", { ticker, bedrag, aantal }); }
      else await FIN.api("extra_aantal", { ticker: r.ticker, aantal: +(r.aantal + aantal).toFixed(8) });  // MeDirect/OKX: nieuw totaal
      FIN.closeSheet(); FIN.toast("Opgeslagen · pagina wordt binnen een halve minuut bijgewerkt");
    } catch (e) { FIN.toast(e.message, true); }
  };
};

$("buyBtn").hidden = !FIN.canEdit; $("buyBtn").onclick = openBuy;

// ---------- verdeling ----------
const SPLITS = { Thema: r => r.thema };
const COLORS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "#0ea5e9", "#a3a3a3", "#84cc16"];
let splitBy = "Thema";
const SP = D.spreiding || {};
if (SP.Land) { SPLITS.Land = null; SPLITS.Sector = null; SPLITS.Bedrijf = null; }  // door in je ETF's te kijken
function drawSplit() {
  const m = {};
  if (SPLITS[splitBy]) ALL.forEach(r => { const k = SPLITS[splitBy](r); m[k] = (m[k] || 0) + r.waarde; });
  else { const list = SP[splitBy], top = splitBy === "Bedrijf" ? 15 : 10;
    list.slice(0, top).forEach(([k, v]) => m[k] = v);
    const rest = list.slice(top).reduce((a, [, v]) => a + v, 0);
    if (rest > 0) m[`Overige (${list.length - top})`] = rest; }
  if (INV.cash_eur) m["Cash"] = (m["Cash"] || 0) + INV.cash_eur;
  const rows = Object.entries(m), ordered = rows.filter(([k]) => !k.startsWith("Overige")).sort((a, b) => b[1] - a[1]).concat(rows.filter(([k]) => k.startsWith("Overige")));
  const max = Math.max(...ordered.map(r => r[1]));
  $("split").innerHTML = ordered.map(([k, v], i) => `<div class="bar-row" style="--c:${COLORS[i % COLORS.length]}"><span class="nm">${esc(k)}</span>
    <span class="vv">${eur(v)} <span class="sub">${(v / totVal * 100).toLocaleString("nl-BE", { maximumFractionDigits: v / totVal < 0.1 ? 1 : 0 })}%</span></span>
    <div class="share"><div style="width:${v / max * 100}%"></div></div></div>`).join("");
}
$("splitBy").innerHTML = Object.keys(SPLITS).map(k => `<button data-s="${k}" class="${k === splitBy ? "on" : ""}">${k}</button>`).join("");
$("splitBy").onclick = e => { const b = e.target.closest("button"); if (!b) return; splitBy = b.dataset.s;
  $("splitBy").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); drawSplit(); };
drawSplit();

// ---------- toekomst: wat je beleggingen kunnen worden ----------
(() => {
  const short = v => v >= 1e6 ? "€" + (v / 1e6).toLocaleString("nl-BE", { maximumFractionDigits: 2 }) + "M" : v >= 1e4 ? "€" + Math.round(v / 1e3) + "k" : eur(v);
  const last = VIDX.at(-1), V0F = VTOT[last] || 0, I0F = ITOT[last] || 0;
  // maandeinden: gemiddelde inleg van de laatste 12 maanden en beweeglijkheid uit je eigen maandresultaten
  const ends = {}; VIDX.forEach(i => ends[H.datum[i].slice(0, 7)] = i);
  const ME = Object.keys(ends).sort().map(m => [VTOT[ends[m]], ITOT[ends[m]]]);
  const deps = ME.slice(-13).map((r, i, a) => i ? r[1] - a[i - 1][1] : 0).slice(1);
  const avgDep = Math.max(0, Math.round(deps.reduce((a, b) => a + b, 0) / Math.max(1, deps.length) / 10) * 10);
  const rets = []; for (let i = 1; i < ME.length; i++) { const p = ME[i - 1], c = ME[i]; if (p[0] > 300) rets.push((c[0] - p[0] - (c[1] - p[1])) / p[0]); }
  const mean = rets.reduce((a, b) => a + b, 0) / Math.max(1, rets.length);
  const sd = Math.sqrt(rets.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, rets.length - 1));
  const SIGMA = Math.min(.35, Math.max(.12, sd * Math.sqrt(12) || .17));
  let DEP = avgDep, YRS = 20;
  try { const st = JSON.parse(localStorage.getItem("projSet") || "{}"); if (st.dep != null) DEP = st.dep; if (st.yrs) YRS = st.yrs; } catch (e) {}
  const path = (rate, months, dep) => { const rm = Math.pow(1 + rate, 1 / 12) - 1, out = [V0F]; let v = V0F; for (let m = 1; m <= months; m++) { v = v * (1 + rm) + dep; out.push(v); } return out; };
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function monteCarlo(months, dep, n = 2000) {  // 2.000 mogelijke beurzen, gemiddeld 7% per jaar
    const r = rng(42), mu = Math.log(1.07) / 12 - SIGMA ** 2 / 24, sm = SIGMA / Math.sqrt(12), qs = [.05, .25, .5, .75, .95];
    const step = Math.max(1, Math.round(months / 120)), idx = []; for (let m = 0; m <= months; m += step) idx.push(m); if (idx.at(-1) !== months) idx.push(months);
    const snaps = idx.map(() => new Float64Array(n));
    for (let k = 0; k < n; k++) { let v = V0F, j = 0;
      for (let m = 0; m <= months; m++) { if (m) { const z = Math.sqrt(-2 * Math.log(r() || 1e-12)) * Math.cos(2 * Math.PI * r()); v = v * Math.exp(mu + sm * z) + dep; }
        if (m === idx[j]) { snaps[j][k] = v; j++; } } }
    return { idx, q: snaps.map(a => { const s2 = Array.from(a).sort((x, y) => x - y); return qs.map(q => s2[Math.floor(q * (n - 1))]); }) };
  }
  const yearOf = m => String(new Date().getFullYear() + Math.floor((new Date().getMonth() + m) / 12));
  function draw() {
    try { localStorage.setItem("projSet", JSON.stringify({ dep: DEP, yrs: YRS })); } catch (e) {}
    const M = YRS * 12, MC = monteCarlo(M, DEP), xs = MC.idx, q = MC.q, n = xs.length - 1;
    const det = [.10, .07, .02].map(r => { const p = path(r, M, DEP); return xs.map(m => p[m]); });
    const inl = xs.map(m => I0F + DEP * m);
    const head = j => { $("fBig").textContent = eur(det[1][j]); $("fSub").textContent = j === n ? `over ${YRS} jaar` : `in ${yearOf(xs[j])}`;
      $("fSub2").innerHTML = `<span class="pos">goed ${short(det[0][j])}</span> · <span class="neg">slecht ${short(det[2][j])}</span> · ingelegd ${short(inl[j])}`; };
    head(n);
    FIN.line($("fChart"), { height: 200, axis: true, zero: true, fmt: short, xlabels: j => xs[j] ? "+" + Math.round(xs[j] / 12) + "j" : "nu",
      series: [{ vals: q.map(r => r[4]), lo: q.map(r => r[0]), color: "var(--accent)", opacity: .12 }, { vals: q.map(r => r[3]), lo: q.map(r => r[1]), color: "var(--accent)", opacity: .22 },
        { vals: inl, color: "var(--muted)", width: 1.3, dash: "3 4", dot: false }, { vals: det[0], color: "var(--pos)", width: 1.5 }, { vals: det[2], color: "var(--neg)", width: 1.5 },
        { vals: det[1], color: "var(--accent)", width: 2.4 }], onScrub: j => head(j == null ? n : j) });
  }
  const dep = $("fDep"), depN = $("fDepN"); dep.value = depN.value = DEP;
  let t; const setDep = v => { DEP = Math.max(0, +v || 0); dep.value = depN.value = DEP; clearTimeout(t); t = setTimeout(draw, 60); };
  dep.oninput = e => setDep(e.target.value); depN.oninput = e => setDep(e.target.value);
  document.querySelectorAll("#fHor button").forEach(b => { b.classList.toggle("on", +b.dataset.y === YRS);
    b.onclick = () => { YRS = +b.dataset.y; document.querySelectorAll("#fHor button").forEach(x => x.classList.toggle("on", x === b)); draw(); }; });
  window.drawFuture = draw; draw();
})();

drawChart();
let rw = innerWidth, rt; addEventListener("resize", () => { if (innerWidth === rw) return; rw = innerWidth; clearTimeout(rt); rt = setTimeout(() => { drawChart(); drawFuture(); }, 150); });
</script>
