:root{--a:#ffa028;--o:#ff7a00;--t:#e6e6e6;--m:#858585;--b:#2a2a2a;--n:#ff4545}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--t);font:14px/1.4 "IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--o);color:#000;font-weight:600;letter-spacing:.05em;padding:3px 12px;font-size:13px}
main{flex:1;display:grid;place-items:center;padding:16px}

.in{padding:14px 12px}

.dots.err i{border-color:var(--n)}.dots.err i.f{background:var(--n)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{font:inherit;font-size:22px;padding:12px 0;background:#0e0e0e;color:var(--t);border:1px solid var(--b);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pad button:active,.pad button:hover{background:var(--a);color:#000;border-color:var(--a)}
.pad button.k{font-size:14px;color:var(--m)}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--b);background:#0e0e0e;color:var(--t)}input:focus{outline:1px solid var(--a)}
.go{margin-top:8px;width:100%;font:inherit;font-weight:600;padding:10px;border:0;background:var(--a);color:#000;cursor:pointer}
p.msg{color:var(--m);font-size:12px;min-height:17px;margin:10px 0 0;text-align:center}p.msg.e{color:var(--n)}
.links{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--b);padding:8px 12px;font-size:12px}
.links a{color:var(--a);text-decoration:none;cursor:pointer}.links a:hover{text-decoration:underline}
.hide{display:none}
</style></head><body>

async function open_(key) {
  const b = BLOBS[ROLE];

async function pageKey(pw) {

const SERVER = "https://servermad.tailf0e9e1.ts.net";

async function wrap(p, pw) {  // wachtwoord achter de pincode bewaren op dit toestel

async function server(p) {

async function key(k) {
