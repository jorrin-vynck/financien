  for (const role of Object.keys(BLOBS)) {
    const raw = sessionStorage.getItem("fin_" + role + "_" + SALTS[role]);
    if (!raw) continue;
    try { const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]); await open_(role, key); return true; } catch (e) {}
  }
  return false;
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, msg = document.getElementById("msg"), btn = document.getElementById("b");
  btn.disabled = true; msg.textContent = "Bezig met openen…";
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  for (const role of Object.keys(BLOBS)) {
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALTS[role]), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    try {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOBS[role].iv) }, key, b64(BLOBS[role].ct));
      sessionStorage.setItem("fin_" + role + "_" + SALTS[role], btoa(String.fromCharCode(...raw)));
      return open_(role, key);
    } catch (err) {}
  }
  btn.disabled = false; msg.textContent = "Verkeerd paswoord.";
});
fromSession();
