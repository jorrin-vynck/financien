const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open_(role, key) {
  const b = BLOBS[role];
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(b.iv) }, key, b64(b.ct));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();

async function fromSession() {

    try { const key = await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"]); await open_(role, key); return true; } catch (e) {}

}
