<style>
:root { color-scheme: light; --bg: #f2f2f6; --surface: #fff; --surface-2: #e9e9ee; --text: #0c0c10; --muted: #8a8a94; --accent: #5b5bd6; --neg: #e5484d; }
@media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #000; --surface: #111114; --surface-2: #1c1c22; --text: #f4f4f6; --muted: #7d7d89; --accent: #8b8cff; --neg: #ff5c61; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
.box { width: min(320px, 100%); display: flex; flex-direction: column; align-items: center; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 32px; }
.dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
.dots i { width: 14px; height: 14px; border-radius: 99px; border: 2px solid var(--muted); display: block; transition: background .1s, border-color .1s; }
.dots i.f { background: var(--text); border-color: var(--text); }
.dots.err { animation: shake .35s; } .dots.err i { border-color: var(--neg); } .dots.err i.f { background: var(--neg); }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
p.msg { color: var(--muted); font-size: 14px; min-height: 20px; margin: 0 0 24px; text-align: center; }
p.msg.e { color: var(--neg); }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 24px; justify-content: center; }
.pad button { width: 76px; height: 76px; border-radius: 99px; border: 0; background: var(--surface-2); color: var(--text); font: inherit; font-size: 28px; font-weight: 500; cursor: pointer; }
.pad button:active { background: var(--muted); }
.pad button.k { background: transparent; font-size: 22px; color: var(--muted); }
.pad button.k:active { color: var(--text); }
.links { margin-top: 32px; }
.links a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
.hide { display: none; }
html.auto .box { visibility: hidden; }
.sw { display: flex; align-items: center; gap: 12px; margin-top: 20px; color: var(--muted); font-size: 14px; cursor: pointer; }
.sw input { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 99px; background: var(--surface-2); position: relative; cursor: pointer; margin: 0; }
.sw input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 99px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.sw input:checked { background: var(--accent); } .sw input:checked::after { left: 21px; }
/* ASCII-stijl */
html.ascii body { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
html.ascii *, html.ascii *::before, html.ascii *::after { border-radius: 0 !important; }
html.ascii h1 { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; text-shadow: 0 0 10px color-mix(in srgb, var(--text) 40%, transparent); }
html.ascii h1::after { content: "_"; animation: ablink 1s steps(1) infinite; color: var(--accent); }
@keyframes ablink { 50% { opacity: 0; } }
html.ascii .dots i.f { box-shadow: 0 0 8px var(--text); }
html.ascii .pad button { background: transparent; font-family: "Silkscreen", monospace; font-size: 24px; color: var(--accent); }
html.ascii .pad button::before { content: "["; color: var(--muted); } html.ascii .pad button::after { content: "]"; color: var(--muted); }
html.ascii .pad button.k::before, html.ascii .pad button.k::after { content: ""; }
html.ascii .links a:hover { text-decoration: underline; }
html.ascii .pad button:active { background: var(--text); color: var(--bg); }
html.ascii .pad button.k { outline: 0; font-family: inherit; font-size: 20px; }
html.ascii .links a, html.ascii .sw { text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
html.ascii body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
@media (max-height: 640px) { h1 { margin-bottom: 20px; } .pad { grid-template-columns: repeat(3, 64px); gap: 12px 20px; } .pad button { width: 64px; height: 64px; font-size: 24px; } }
